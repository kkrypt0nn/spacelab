name: Build and push Docker images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Docker image version (must start with v)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version
        run: |
          [[ "${VERSION}" == v* ]] || (echo "Version must start with v" && exit 1)
        env:
          VERSION: ${{ inputs.version }}

      - name: Extract version without v
        id: version
        run: echo "version_no_v=${VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kkrypt0nn/spacelab:latest
            kkrypt0nn/spacelab:${{ steps.version.outputs.version_no_v }}
            ghcr.io/kkrypt0nn/spacelab:latest
            ghcr.io/kkrypt0nn/spacelab:${{ steps.version.outputs.version_no_v }}
