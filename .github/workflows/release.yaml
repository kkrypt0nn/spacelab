name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must start with v)
        required: true
        type: string
      create_docker_images:
        description: Create and push Docker images
        required: true
        type: boolean
        default: true
      create_git_tag:
        description: Create Git tag and GitHub Release
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        run: |
          [[ "${VERSION}" == v* ]] || (echo "Version must start with v" && exit 1)
        env:
          VERSION: ${{ inputs.version }}

  docker:
    name: Create docker images
    needs: validate
    if: ${{ inputs.create_docker_images }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version without v
        id: version
        run: echo "version_no_v=${VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kkrypt0nn/spacelab:latest
            kkrypt0nn/spacelab:${{ steps.version.outputs.version_no_v }}
            ghcr.io/kkrypt0nn/spacelab:latest
            ghcr.io/kkrypt0nn/spacelab:${{ steps.version.outputs.version_no_v }}

  release:
    name: Create git tag
    needs: validate
    if: ${{ inputs.create_git_tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create and push Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            --verify-tag \
            --title "Spacelab $VERSION" \
            --generate-notes
